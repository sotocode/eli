<audio id="click-sound" src="assets/transitionsound.mp3" preload="auto"></audio>
<script>
document.addEventListener("click", function(event) {

    const link = event.target.closest("a");
    const button = event.target.closest("button");

    // Ignore clicks that aren't on links or buttons
    if (!link && !button) return;

    const sound = document.getElementById("click-sound");

    // Restart the sound
    sound.currentTime = 0;

    // If it's a link, wait for the sound before navigating
    if (link) {
        event.preventDefault();

        const destination = link.href;

        sound.onended = function() {
            window.location.href = destination;
        };

        sound.play().catch(function() {
            window.location.href = destination;
        });

    } else {
        // Regular buttons just play the sound
        sound.play();
    }

});
</script>
