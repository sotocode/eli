<script>
document.addEventListener("click", function(event) {

    const link = event.target.closest("a");
    const button = event.target.closest("button");

    // Ignore clicks that aren't on links or buttons
    if (!link && !button) return;

    const sound = document.getElementById("click-sound");

    // Restart the sound
    sound.currentTime = 0;

    // If it's a link, wait for the sound before navigating
    if (link) {
        event.preventDefault();

        const destination = link.href;

        sound.onended = function() {
            window.location.href = destination;
        };

        sound.play().catch(function() {
            window.location.href = destination;
        });

    } else {
        // Regular buttons just play the sound
        sound.play();
    }

});
</script>

<script>
const menuToggle = document.getElementById("menu-toggle");
const menuItems = document.getElementById("menu-items");

menuToggle.addEventListener("click", function() {
    menuItems.classList.toggle("active");
    menuToggle.classList.toggle("active");
});
</script>


<script>
const artworks = Array.from(
    document.querySelectorAll(".artwork-thumbnail")
);

const overlay = document.getElementById("art-overlay");
const expandedImage = document.getElementById("expanded-artwork");
const artTitle = document.getElementById("art-title");
const artDescription = document.getElementById("art-description");

let currentIndex = 0;

function showArtwork(index) {
    currentIndex = index;

    const artwork = artworks[currentIndex];

    expandedImage.src = artwork.src;
    expandedImage.alt = artwork.alt;
    artTitle.textContent = artwork.dataset.title;
    artDescription.textContent = artwork.dataset.description;
}

function openArtwork(index) {
    showArtwork(index);
    overlay.classList.add("active");
}

function changeArtwork(direction) {
    const nextIndex = currentIndex + direction;

    if (nextIndex >= 0 && nextIndex < artworks.length) {
        showArtwork(nextIndex);
        return;
    }

    const currentPage = artworks[currentIndex].dataset.page;

    const destination = direction === 1
        ? getNextPage(currentPage)
        : getPreviousPage(currentPage);

    if (destination) {
        sessionStorage.setItem(
            "openFirstArtwork",
            direction === 1 ? "first" : "last"
        );

        window.location.href = destination;
    }
}

// Set the order of your pages here
const galleryPages = [
    "my-art-a.html",
    "my-art-b.html",
    "my-art-c.html",
    "my-art-d.html",
    "my-art-e.html",
];

function getNextPage(currentPage) {
    const index = galleryPages.indexOf(currentPage);
    return galleryPages[index + 1] || null;
}

function getPreviousPage(currentPage) {
    const index = galleryPages.indexOf(currentPage);
    return galleryPages[index - 1] || null;
}

artworks.forEach(function(artwork, index) {
    artwork.addEventListener("click", function() {
        openArtwork(index);
    });
});

document.getElementById("art-prev").addEventListener("click", function() {
    changeArtwork(-1);
});

document.getElementById("art-next").addEventListener("click", function() {
    changeArtwork(1);
});

document.getElementById("art-close").addEventListener("click", function() {
    overlay.classList.remove("active");
});

overlay.addEventListener("click", function(event) {
    if (event.target === overlay) {
        overlay.classList.remove("active");
    }
});

document.addEventListener("keydown", function(event) {
    if (!overlay.classList.contains("active")) return;

    if (event.key === "Escape") {
        overlay.classList.remove("active");
    }

    if (event.key === "ArrowLeft") {
        changeArtwork(-1);
    }

    if (event.key === "ArrowRight") {
        changeArtwork(1);
    }
});

// Automatically open the first or last artwork after changing pages
const openPosition = sessionStorage.getItem("openFirstArtwork");

if (openPosition && artworks.length > 0) {
    sessionStorage.removeItem("openFirstArtwork");

    if (openPosition === "first") {
        openArtwork(0);
    } else {
        openArtwork(artworks.length - 1);
    }
}
</script>
